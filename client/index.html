<!DOCTYPE html>
<html lang="en" translate="no">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the layout reach under the notch; the safe-area
       insets in index.css keep content clear of it. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <meta name="google" content="notranslate" />

  <!-- Installed-app behaviour: no browser chrome, branded status bar. The
       manifest is generated from the panel's own branding. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#599ed3" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <script>
    // Registered after load so it never competes with the first paint.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("/sw.js")
          .then(function (reg) {
            // An installed app can sit on an old worker for a long time, and a
            // worker without the push handler silently drops notifications.
            // Checking on every load keeps it current.
            reg.update();
          })
          .catch(function () {
            /* an app that cannot install still works */
          });
      });
    }
  </script>
</body>

</html>
